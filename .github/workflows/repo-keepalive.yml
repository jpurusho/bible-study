name: Repo Keepalive

# Scheduled workflows are auto-disabled after 60 days of repository inactivity.
# Cron runs do not count as activity — a push does. This commits a timestamp
# monthly so the other scheduled workflows never get disabled.

on:
  schedule:
    - cron: '13 4 1 * *'    # 4:13 AM UTC on the 1st of each month
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Commit keepalive timestamp
        run: |
          date -u +'%Y-%m-%dT%H:%M:%SZ' > .github/last-keepalive
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/last-keepalive
          git commit -m 'chore: repo keepalive [skip ci]'
          git push
