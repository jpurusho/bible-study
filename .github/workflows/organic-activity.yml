name: Organic Activity

on:
  schedule:
    - cron: '27 6 * * *'    # 6:27 AM UTC daily
    - cron: '51 17 * * *'   # 5:51 PM UTC daily
  workflow_dispatch:

jobs:
  activity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Simulate organic usage
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          sleep $((RANDOM % 60))
          python3 scripts/organic-activity.py
